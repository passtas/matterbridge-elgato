name: Publish to npm

# Publishing to npm is what gets the plugin listed in Matterbridge's frontend:
# its "Search plugins" dialog scrapes the npm registry for `matterbridge-*`.
#
# Authentication is npm trusted publishing (OIDC): the package's trusted
# publisher on npmjs.com is this repository and this workflow file, so no
# token or secret is involved and npm attaches provenance automatically.
# `id-token: write` is what makes that possible.
#
# The very first version was published by hand, because npm only lets you
# configure a trusted publisher on a package that already exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci --no-fund --no-audit

      # A plugin must never depend on matterbridge; it is linked from the global
      # install instead. See docs/matterbridge-api-cheatsheet.md §1.
      - name: Link matterbridge
        run: |
          npm i -g matterbridge --no-fund --no-audit
          npm link matterbridge --no-fund --no-audit

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
