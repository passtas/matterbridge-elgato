name: Publish image

# Multi-arch image to GHCR. The plugin is baked in from the tarball this
# workflow packs, so the image and the npm release are always the same code.
#
# No secrets needed: GITHUB_TOKEN can push to ghcr.io/<owner>/* given
# `packages: write`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/matterbridge-elgato

jobs:
  build:
    name: Test, pack and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-fund --no-audit

      # A plugin must never depend on matterbridge; it is linked from the global
      # install instead. See docs/matterbridge-api-cheatsheet.md §1.
      - name: Link matterbridge
        run: |
          npm i -g matterbridge --no-fund --no-audit
          npm link matterbridge --no-fund --no-audit

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      # deploy/Dockerfile builds with `deploy/` as its context, so the tarball
      # has to land there before the image build.
      - name: Pack the plugin
        id: pack
        run: |
          tarball="$(npm pack --silent)"
          mv "$tarball" deploy/
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          # Pinned here as well as in the Dockerfile, because metadata-action's
          # generated labels are applied last and would otherwise win.
          labels: |
            org.opencontainers.image.title=matterbridge-elgato
            org.opencontainers.image.description=Matterbridge with the Elgato light plugin pre-installed: Elgato Key Light, Key Light Air and Light Strip in Google Home, Apple Home and Alexa over Matter
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v7
        with:
          context: deploy
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            PLUGIN_TARBALL=${{ steps.pack.outputs.tarball }}
            PLUGIN_VERSION=${{ steps.pack.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
